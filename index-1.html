  const n=(day*3+i*5+j*2)%e.parties.length;let a=e.parties[n],b=e.parties[(n+3+j)%e.parties.length];if(a===b)b=e.parties[(n+1)%e.parties.length];

  const time=['01:00','14:30','20:30','18:00','23:00','11:00','19:30','22:00','16:15','21:15','23:30'][i*3+j]||'19:00';
  const bo=(j===2&&i===0)?'BO5':'BO3';const mapNames=bo==='BO5'?MAP_POOL:MAP_POOL.slice(0,3);

  else if(status==='live'){winners=bo==='BO5'?['a','b','a']:j%2===0?['a']:['a','b'];}
  let maps=mapNames.map((name,k)=>{
   if(status==='coming'||k>winners.length)return {name,a:null,b:null,status:'coming'};

   if(k>=winners.length)return {name,a:null,b:null,status:'coming'};

const PAGES={sources:'字段来源对照',match:'比赛详情',team:'战队详情',player:'选手详情',event:'赛事详情',news:'资讯中心',article:'新闻正文',transfers:'转会动态',saved:'已收藏的文章',reminders:'关注的比赛',search:'搜索',about:'关于 MatchScope'};
const TAB_TEXT={overview:'总览',maps:'地图',stats:'选手数据',h2h:'交手记录',roster:'阵容',matches:'比赛',performance:'数据',schedule:'赛程',bracket:'对阵图',participants:'参赛战队'};
function openView(type,id=''){if(type==='match'&&!findMatch(id))return;if(type==='team'&&!teamById[id])return;if(type==='player'&&!playerById[id])return;if(type==='event'&&!eventById[id])return;if(type==='article'&&!newsById[id])return;
 if(state.route)state.viewStack.push({...state.route,detailTab:state.detailTab});state.route={type,id};state.detailTab='overview';renderDetail();}
state.viewStack=[];
function closeView(){if(state.viewStack.length){const prev=state.viewStack.pop();state.route={type:prev.type,id:prev.id};state.detailTab=prev.detailTab||'overview';renderDetail();}else{state.route=null;$('#detail-root').innerHTML='';$('#detail-root').style.display='none';}}

 let titles={...PAGES};if(view.type==='team')titles.team=teamById[view.id]?.name||'战队详情';if(view.type==='player')titles.player=playerById[view.id]?.name||'选手';if(view.type==='event')titles.event=eventById[view.id]?.name||'赛事';
 if(view.type==='article')titles.article='资讯正文';
 let headerBtn='';if(view.type==='team'){let on=state.following.includes(view.id);headerBtn=`<button class="icon-button" data-action="follow" data-id="${view.id}" aria-label="${on?'取消关注':'关注战队'}" style="color:${on?'#26876B':'#73777C'}">${icon(on?'check':'star',22)}</button>`}
 if(view.type==='article'){let on=state.savedNews.includes(view.id);headerBtn=`<button class="icon-button" data-action="save-news" data-id="${view.id}" aria-label="${on?'取消收藏':'收藏文章'}" style="color:${on?'#267C64':'#787B80'}">${icon(on?'check':'bookmark',21)}</button>`}
 root.innerHTML=`<header class="detail-header"><button class="icon-button" data-action="back" aria-label="返回">${icon('back',24)}</button><strong class="detail-header-title">${txt(titles[view.type]||'详情')}</strong>${headerBtn||''}</header><div class="detail-body" id="detail-body">${renderDetailBody(view)}</div>`;
}
function detailTabs(options){return `<div class="detail-tabs" role="tablist">${options.map(k=>`<button class="detail-tab ${state.detailTab===k?'active':''}" data-action="detail-tab" data-id="${k}" role="tab" aria-selected="${state.detailTab===k}">${TAB_TEXT[k]}</button>`).join('')}</div>`}
function statTile(value,label){return `<div class="stat-tile"><strong>${value}</strong><small>${label}</small></div>`}
function detailSection(title,content){return `<h3 class="detail-subheading">${title}</h3><div class="surface">${content}</div>`}
function rowDetail(left,right){return `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-bottom:1px solid #F1F1F2;font-size:12px"><span style="color:#91949A">${left}</span><strong style="font-size:12px;text-align:right">${right}</strong></div>`}
function renderDetailBody(v){const f={match:renderMatchDetail,team:renderTeamDetail,player:renderPlayerDetail,event:renderEventDetail,news:renderNewsCenter,article:renderArticle,transfers:renderTransfers,saved:renderSaved,reminders:renderReminders,search:renderSearch,sources:renderSources,about:renderAbout};return (f[v.type]||renderAbout)(v.id)}
function activeSeries(m){const own=state.liveIncrements[m.id]||0;return own}
function matchScoreLarge(m){let s=m.series;if(!s)return 'VS';return `${s[0]} : ${s[1]}`}
function liveRowSummary(m){return m.status==='live'?`<span class="status-pill live">• 正在进行（模拟）</span>`:`<span class="status-pill ${m.status}">${STATUS[m.status]}</span>`}
function mapTile(row,i){let no=i+1;const played=row.status!=='coming';return `<div class="map-tile"><span style="width:23px;font-size:11px;color:#A0A4A9">${String(no).padStart(2,'0')}</span><div class="grow"><div class="map-name">${txt(row.name)}</div><div class="map-sub">${row.status==='live'?'当前地图 · 模拟更新':row.status==='ended'?'地图已结束':'尚未开打'}</div></div><div class="map-side-score">${played?`<span style="color:${row.a>row.b?'#238369':'#373B3F'}">${row.a}</span><span style="color:#B4B5B8">:</span><span style="color:${row.b>row.a?'#238369':'#373B3F'}">${row.b}</span>`:'<span style="font-size:12px;color:#AFB1B5">— : —</span>'}</div></div>`}
function pseudoStats(m,tid,map='all'){const t=teamById[tid],maps=map==='all'?m.maps.filter(r=>r.status!=='coming'):[m.maps[Number(map)]].filter(r=>r&&r.status!=='coming');
 return t.players.map((id,i)=>{let p=playerById[id],kills=0,deaths=0,assists=0,adr=0,kast=0,rating=0;
  maps.forEach((row,mi)=>{const seed=(m.date.charCodeAt(m.date.length-1)+t.hltv+i*4+Number(map==='all'?mi:map))%8;
    kills+=10+seed+i;deaths+=10+((seed+i*3)%8);assists+=2+i%4;adr+=65+seed*2+i;kast+=66+seed+i;rating+=0.92+seed*.04+i*.014;
  });const n=maps.length||1;
  return {...p,kills,deaths,assists,adr:Math.round(adr/n),kast:Math.round(kast/n),rating:Number((rating/n).toFixed(2))};
 });
}
function statTableFor(m,tid,map='all'){const t=teamById[tid],data=pseudoStats(m,tid,map);return `<div class="stats-label">${txt(t.name)} · ${map==='all'?'全部已开始地图':txt(m.maps[Number(map)]?.name||'地图')} · 演示</div>
 <div class="table-responsive"><table class="stats-table" style="min-width:350px"><thead><tr><th>选手</th><th>K-D</th><th>ADR</th><th>KAST</th><th>Rating 3.0</th></tr></thead>
 <tbody>${data.map(p=>`<tr data-action="open-player" data-id="${p.id}" style="cursor:pointer" role="button" tabindex="0"><td class="player-name">${txt(p.name)}</td><td>${p.kills}-${p.deaths}</td><td>${p.adr.toFixed(0)}</td><td>${p.kast}%</td><td class="rating">${p.rating.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`;}
function matchVeto(m){if(m.status==='coming')return `<div style="padding:17px 15px;font-size:12px;color:#9A9CA3">地图选择尚未公布。正式版仅在 HLTV 提供选图禁图信息时显示。</div>`;
 const a=teamById[m.a],b=teamById[m.b];const veto=m.bo==='BO5'?
 [`${a.name} 禁用 Cache`,`${b.name} 禁用 Anubis`,`${a.name} 选择 Mirage`,`${b.name} 选择 Inferno`,`${a.name} 选择 Nuke`,`${b.name} 选择 Dust2`,'Ancient 为决胜地图']:
 [`${a.name} 禁用 Ancient`,`${b.name} 禁用 Dust2`,`${a.name} 选择 Mirage`,`${b.name} 选择 Inferno`,`${a.name} 禁用 Cache`,`${b.name} 禁用 Anubis`,'Nuke 为决胜地图'];
 return veto.map((v,i)=>`<div class="row" style="gap:11px;padding:10px 14px;border-bottom:1px solid #F2F2F3"><span class="sub" style="min-width:17px;font-size:11px">${i+1}</span><span style="font-size:12px">${txt(v)}</span></div>`).join('')+`<div style="padding:12px;color:#9BA0A7;font-size:11px">模拟流程，HLTV 实际记录的选图禁图顺序以对应比赛为准。</div>`;
}
function matchMapDetail(m){return m.maps.map((map,i)=>`<div class="map-tile"><span style="min-width:23px;font-size:11px;color:#A0A4A9">${String(i+1).padStart(2,'0')}</span><div class="grow"><div class="map-name">${txt(map.name)}</div><div class="map-sub">${map.status==='coming'?'尚未开打':map.status==='live'?'当前地图':'已结束'} · ${halfText(map)}</div></div><div class="map-side-score">${map.status==='coming'?'— : —':`${map.a} : ${map.b}`}</div></div>`).join('');}

function renderMatchDetail(id){const m=findMatch(id),a=teamById[m.a],b=teamById[m.b],event=eventById[m.eventId];
 if(m.status==='live'&&activeSeries(m)>0){m.maps=m.maps.map(row=>row.status==='live'?{...row,a:row.a+Math.floor((activeSeries(m)+1)/2),b:row.b+Math.floor(activeSeries(m)/2)}:row)}
 const head=`<div class="surface match-hero"><button class="match-event-line" data-action="open-event" data-id="${event.id}" style="border:0;background:none;margin:0 auto 19px">${icon('trophy',15)} ${txt(event.name)} ${icon('right',14)}</button>
 <div class="hero-teams"><div class="hero-side">${teamLogo(a)}<button data-action="open-team" data-id="${a.id}">${txt(a.name)}</button></div><div><div class="hero-score">${matchScoreLarge(m)}</div><div class="hero-meta">${txt(m.bo)} · ${m.status==='ended'?'比赛结束':m.status==='live'?'进行中':'等待开赛'}</div><div style="margin-top:9px">${liveRowSummary(m)}</div></div><div class="hero-side">${teamLogo(b)}<button data-action="open-team" data-id="${b.id}">${txt(b.name)}</button></div></div>
 <div class="hero-meta" style="text-align:center;margin-top:16px">${m.date} · ${m.time} · 北京时间</div><div class="detail-actions"><button class="action-pill ${state.reminders.includes(id)?'active':''}" data-action="reminder" data-id="${id}">${icon(state.reminders.includes(id)?'check':'bell',16)} ${state.reminders.includes(id)?'已关注':'关注比赛'}</button>${m.status==='live'?`<button class="action-pill" data-action="demo-refresh" data-id="${id}">${icon('refresh',15)} 模拟刷新</button>`:''}</div></div>`;
 const played=m.maps.filter(x=>x.status!=='coming').length,finished=m.maps.filter(x=>x.status==='ended').length;
 let body='';
 if(state.detailTab==='overview'){
   body=`${detailSection('比赛总览',`<div style="padding:13px"><div class="stat-grid">${statTile(m.bo,'比赛赛制')}${statTile(String(finished),'已结束地图')}${statTile(txt(STATUS[m.status]),'比赛状态')}</div></div>`)}
   ${detailSection('地图比分',matchMapDetail(m))}${detailSection('选图禁图',matchVeto(m))}
   ${detailSection('双方选手名单',`<div class="row between" style="padding:13px">${teamLogo(a)}<span style="font-size:11px;color:#A4A7AE">对阵双方</span>${teamLogo(b)}</div>${a.players.map((x,i)=>{let p=playerById[x],q=playerById[b.players[i]];return `<div class="row between" style="padding:11px 13px;border-top:1px solid #F3F3F3;font-size:12px"><button data-action="open-player" data-id="${p.id}" style="background:none;border:0;font-weight:700">${txt(p.name)}</button><span style="color:#A6A8AD">选手</span><button data-action="open-player" data-id="${q.id}" style="background:none;border:0;font-weight:700">${txt(q.name)}</button></div>`}).join('')}`)}`;
 }else if(state.detailTab==='maps'){
   body=`${detailSection('地图 / 半场比分',matchMapDetail(m))}${detailSection('选图禁图记录',matchVeto(m))}`;
 }else if(state.detailTab==='stats'){
   if(!played)body=`<div class="surface"><div class="empty"><b>尚无选手比赛统计</b><p>比赛未开始，HLTV 通常不会提供实际 K-D / ADR / Rating。</p></div></div>`;
   else {
     const sm=state.statMap||'all';
     const chips=[['all','全部地图'],...m.maps.filter(r=>r.status!=='coming').map(r=>[String(m.maps.indexOf(r)),r.name])];
     body=`<div class="chips" role="group" aria-label="统计地图切换">${chips.map(([key,label])=>`<button class="chip ${sm===key?'active':''}" data-action="stat-map" data-id="${key}">${txt(label)}</button>`).join('')}</div><div class="surface">${statTableFor(m,a.id,sm)}<div class="thin-divider"></div>${statTableFor(m,b.id,sm)}</div><div class="detail-note">统计字段对应 HLTV Match stats：K-D、ADR、KAST、Rating 3.0；数值全部为模拟。历史比赛可能使用不同 Rating 版本。</div>`;
   }
 }else{
   const history=[];for(let d=-1;d>=-45;d--){const key=addDays(m.date,d);for(const g of generateDayMatches(key))for(const other of g.matches){if((other.a===m.a&&other.b===m.b)||(other.a===m.b&&other.b===m.a))history.push(other);}}
   body=detailSection('历史交手',history.length?history.slice(-4).reverse().map(h=>`<button class="setting-row" data-action="open-match" data-id="${h.id}"><span class="setting-copy"><strong>${txt(a.name)} vs ${txt(b.name)}</strong><small>${dateLabel(h.date)} · ${txt(eventById[h.eventId].name)}</small></span><b>${txt(h.score)}</b>${icon('right',15)}</button>`).join(''):'<div class="empty"><b>暂无历史交手记录</b><p>模拟数据库没有找到两队的先前比赛；HLTV 的 Past matches 在有历史记录时显示。</p></div>');
 }
 return head+detailTabs(['overview','maps','stats','h2h'])+body+sourceFoot('matchDetail','比分 / Veto / 半场比分 / Match stats / Lineups / Past matches')+fakeNote('本场比赛为虚构示例。公开 HLTV 页面有这些字段，但尚未获得实际数据授权。');
}
function renderForm(t){return t.form.map(x=>`<span style="display:inline-grid;place-items:center;margin-left:5px;width:24px;height:24px;border-radius:8px;font-size:11px;color:${x==='胜'?'#277C60':'#CA6A66'};background:${x==='胜'?'#E7F5EC':'#FAEDEC'};font-weight:760">${x==='胜'?'W':'L'}</span>`).join('')}

 const hero=`<div class="surface team-hero">${teamLogo(t)}<h2>${txt(t.name)}</h2><div class="team-country">${t.flag} ${txt(t.country)} · ${txt(t.region)}</div>

 case 'open-reminders':openView('reminders');break;
 case 'open-sources':openView('sources');break;
 case 'open-about':openView('about');break;
 case 'search':state.searchQuery='';openView('search');setTimeout(()=>$('#global-search')?.focus(),45);break;
 case 'back':closeView();break;
 case 'detail-tab':changeDetailTab(id);break;
 case 'demo-refresh':state.liveIncrements[id]=(state.liveIncrements[id]||0)+1;toastMsg('模拟回合已更新（非实时）');renderDetail();break;
 case 'toggle-notices':state.noticeOn=!state.noticeOn;safeStorage.set('noticeOn',state.noticeOn);renderMain(false);toastMsg('已保存偏好（不会发送系统通知）');break;
 case 'timezone':openTimezoneModal();break;
 case 'set-timezone':state.timezone=id;safeStorage.set('timezone',id);closeModal();renderMain(false);toastMsg('已保存时间偏好');break;
 case 'close-modal':closeModal();break;
 }
}
document.addEventListener('click',e=>{const node=e.target.closest('[data-action]');if(!node)return;
 if(node.dataset.action==='close-modal'&&e.target!==node)return;
 handleAction(node);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#modal-root').innerHTML)closeModal();else if(state.route)closeView();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]')){e.preventDefault();handleAction(e.target)}
});
document.addEventListener('change',e=>{if(e.target.id==='native-date'&&e.target.value){state.date=e.target.value;state.collapsed.clear();renderMain(true)}});
document.addEventListener('input',e=>{
 if(e.target.id==='team-query'){let pos=e.target.selectionStart??e.target.value.length;state.teamQuery=e.target.value;renderMain(false);const i=$('#team-query');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch{}}}
 if(e.target.id==='global-search'){state.searchQuery=e.target.value;const hit=$('#search-results');if(hit)hit.innerHTML=searchResults(state.searchQuery);}
});
let touchStart=null;
$('#page-scroll').addEventListener('touchstart',e=>{if(state.tab!=='matches'||state.route||e.target.closest('.dates-strip')||e.target.closest('button')||e.target.closest('input'))return;let t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});
$('#page-scroll').addEventListener('touchend',e=>{if(!touchStart||state.tab!=='matches'||state.route)return;let t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>74&&Math.abs(dx)>Math.abs(dy)*1.7){state.date=addDays(state.date,dx<0?1:-1);state.collapsed.clear();renderMain(true)}},{passive:true});
renderMain(true);
})();
</script>
</body></html>
